        * {

        /* Matrix Background Animation */
        .matrix-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.15;
            pointer-events: none;

        @keyframes matrix-fall {

            100% { transform: translateY(100vh); }
        }
        
        /* Glassmorphism */
        .glass {
            background: rgba(43, 58, 29, 0.2);

            width: 8px;
            height: 8px;

            background: #0a0a0a;

        ::-webkit-scrollbar-thumb {
            background: #2B3A1D;
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #3d5229;
        }
        
        /* Animations */
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 20px rgba(74, 222, 128, 0.3); }
            50% { box-shadow: 0 0 40px rgba(74, 222, 128, 0.6); }
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        
        @keyframes slideIn {
            from { transform: translateX(-100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .animate-float {
            animation: float 3s ease-in-out infinite;
        }
        
        .animate-pulse-glow {
            animation: pulse-glow 2s ease-in-out infinite;
        }
        
        .animate-slide-in {
            animation: slideIn 0.5s ease-out;
        }
        
        .animate-fade-in {
            animation: fadeIn 0.6s ease-out;
        }
        
        /* Matrix Node Styles */
        .matrix-node {
            transition: all 0.3s ease;
        }
        
        .matrix-node:hover {
            transform: scale(1.1);
            filter: brightness(1.3);
        }
        
        .matrix-node.active {
            fill: #4ade80;
            filter: drop-shadow(0 0 10px #4ade80);
        }
        
        .matrix-node.empty {
            fill: #2a2a2a;
            stroke: #3d5229;
        }
        
        /* Level Cards */
        .level-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .level-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 30px rgba(74, 222, 128, 0.1);
        }
        
        /* Progress Bar */
        .progress-bar {
            background: linear-gradient(90deg, #2B3A1D 0%, #4ade80 100%);
            background-size: 200% 100%;
            animation: progress-shine 2s linear infinite;
        }
        
        @keyframes progress-shine {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        
        /* Button Styles */
        .btn-primary {
            background: linear-gradient(135deg, #2B3A1D 0%, #3d5229 100%);
            border: 1px solid rgba(74, 222, 128, 0.3);
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover {
            background: linear-gradient(135deg, #3d5229 0%, #4ade80 100%);
            box-shadow: 0 0 30px rgba(74, 222, 128, 0.4);
            transform: translateY(-2px);
        }
        
        .btn-glow {
            position: relative;
            overflow: hidden;
        }
        
        .btn-glow::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }
        
        .btn-glow:hover::before {
            left: 100%;
        }
        
        /* Stats Counter */
        .stat-value {
            font-variant-numeric: tabular-nums;
        }
        
        /* Tree Visualization */
        .tree-node {
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .tree-node:hover circle {
            fill: #4ade80;
            filter: drop-shadow(0 0 8px #4ade80);
        }
        
        /* Mobile Menu */
        .mobile-menu {

            transition: transform 0.3s ease;
        }
        
        .mobile-menu.active {
            transform: translateX(0);
        }
        
        /* Tooltip */
        .tooltip {
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .has-tooltip:hover .tooltip {

            opacity: 1;
        }

        }
        
        @keyframes skeleton-loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        
        /* Custom Checkbox */
        .custom-checkbox {

            width: 20px;
            height: 20px;
            border: 2px solid #3d5229;
            border-radius: 4px;
            cursor: pointer;
            position: relative;

        .custom-checkbox:checked {

        .custom-checkbox:checked::after {
            content: '✓';
            position: absolute;
            color: #0a0a0a;
            font-size: 14px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        // Utility Functions
        const formatUSDT = (value) => {
            if (!value) return '0.00';
            try {
                const num = typeof value === 'string' ? parseFloat(value) : Number(value);
                if (isNaN(num)) return '0.00';
                return (num / 1e18).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            } catch (e) {
                return '0.00';
            }
        };
        
        const shortenAddress = (addr) => {
            if (!addr) return '';
            return `${addr.slice(0, 6)}...${addr.slice(-4)}`;
        };
        
        const formatTime = (timestamp) => {
            if (!timestamp) return '00:00:00';
            const now = Math.floor(Date.now() / 1000);
            const diff = timestamp - now;
            if (diff <= 0) return '00:00:00';
            
            const days = Math.floor(diff / 86400);
            const hours = Math.floor((diff % 86400) / 3600);
            const minutes = Math.floor((diff % 3600) / 60);
            const seconds = diff % 60;
            
            if (days > 0) return `${days}d ${hours.toString().padStart(2, '0')}h ${minutes.toString().padStart(2, '0')}m`;
            return `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        };

                        const text = chars[Math.floor(Math.random() * chars.length)];
                        ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                        
                        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                            drops[i] = 0;
                        }
                        drops[i]++;
                    }
                };
                
                const interval = setInterval(draw, 35);
                
                const handleResize = () => {
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                };
                
                window.addEventListener('resize', handleResize);
                
                return () => {
                    clearInterval(interval);
                    window.removeEventListener('resize', handleResize);
                };
            }, []);
