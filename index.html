<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NanoTrust - On-Chain Yield Infrastructure</title>
    <meta name="description" content="Powered by Venus Protocol Integration - Advanced DeFi Yield Platform">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- RainbowKit & Wagmi (using CDN for standalone HTML) -->
    <script src="https://unpkg.com/@rainbow-me/rainbowkit@1.3.0/dist/index.umd.js"></script>
    <script src="https://unpkg.com/wagmi@1.4.0/dist/index.umd.js"></script>
    <script src="https://unpkg.com/viem@1.19.0/dist/index.umd.js"></script>
    
    <!-- Chart.js for analytics -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Blockies for identicons -->
    <script src="https://cdn.jsdelivr.net/npm/ethereum-blockies@0.1.1/blockies.min.js"></script>

    <style>
        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #0f0f0f;
            --bg-tertiary: #141414;
            --bg-card: rgba(20, 20, 20, 0.6);
            --bg-card-hover: rgba(30, 30, 30, 0.8);
            
            --accent-primary: #3b82f6;
            --accent-secondary: #60a5fa;
            --accent-glow: rgba(59, 130, 246, 0.3);
            
            --venus-blue: #00d4aa;
            --venus-glow: rgba(0, 212, 170, 0.3);
            
            --gold: #f59e0b;
            --gold-light: #fbbf24;
            --gold-glow: rgba(245, 158, 11, 0.3);
            
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --info: #3b82f6;
            
            --bronze: #cd7f32;
            --silver: #c0c0c0;
            --gold-rank: #ffd700;
            --platinum: #e5e4e2;
            --diamond: #b9f2ff;
            
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.75);
            --text-muted: rgba(255, 255, 255, 0.5);
            --text-tertiary: rgba(255, 255, 255, 0.35);
            
            --gradient-blue: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            --gradient-venus: linear-gradient(135deg, #00d4aa 0%, #00b894 100%);
            --gradient-gold: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            --gradient-card: linear-gradient(145deg, rgba(20, 20, 20, 0.8), rgba(10, 10, 10, 0.9));
            
            --glass-bg: rgba(20, 20, 20, 0.6);
            --glass-border: 1px solid rgba(255, 255, 255, 0.1);
            --glass-border-accent: 1px solid rgba(59, 130, 246, 0.3);
            
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.4);
            --shadow-md: 0 8px 32px rgba(0, 0, 0, 0.5);
            --shadow-lg: 0 16px 48px rgba(0, 0, 0, 0.6);
            --shadow-glow: 0 0 30px rgba(59, 130, 246, 0.2);
            
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
            --radius-xl: 18px;
            --radius-2xl: 22px;
            --radius-full: 9999px;
            
            --transition-fast: 0.15s ease;
            --transition-base: 0.3s ease;
            --transition-slow: 0.5s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        html { scroll-behavior: smooth; font-size: 14px; }
        @media (min-width: 768px) { html { font-size: 15px; } }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.5;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(ellipse at 20% 0%, rgba(59, 130, 246, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 100%, rgba(0, 212, 170, 0.05) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
        }

        /* Layout */
        .app-container { display: flex; min-height: 100vh; }
        
        /* Header */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 64px;
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: var(--glass-border);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.5rem;
        }
        
        .header-left { display: flex; align-items: center; gap: 1rem; }
        
        .menu-toggle {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--glass-bg);
            border: var(--glass-border);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            cursor: pointer;
            font-size: 1.125rem;
            transition: all var(--transition-fast);
        }
        
        .menu-toggle:hover { background: rgba(59, 130, 246, 0.1); border-color: var(--accent-primary); }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
            color: var(--text-primary);
        }
        
        .logo-icon {
            width: 36px;
            height: 36px;
            background: var(--gradient-blue);
            border-radius: var(--radius-lg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            box-shadow: var(--shadow-glow);
        }
        
        .logo-text {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.25rem;
            font-weight: 700;
            background: var(--gradient-venus);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .header-right { display: flex; align-items: center; gap: 1rem; }
        
        /* RainbowKit Connect Button Customization */
        .rk-connect-btn {
            background: var(--gradient-blue) !important;
            border: 1px solid rgba(59, 130, 246, 0.5) !important;
            border-radius: var(--radius-full) !important;
            padding: 0.625rem 1.25rem !important;
            font-family: 'Inter', sans-serif !important;
            font-weight: 600 !important;
            font-size: 0.875rem !important;
            color: white !important;
            box-shadow: var(--shadow-glow) !important;
            transition: all var(--transition-base) !important;
        }
        
        .rk-connect-btn:hover {
            transform: translateY(-2px) !important;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.4) !important;
        }

        /* Sidebar */
        .sidebar {
            position: fixed;
            left: 0;
            top: 64px;
            bottom: 0;
            width: 260px;
            background: rgba(10, 10, 10, 0.98);
            border-right: var(--glass-border);
            z-index: 999;
            transform: translateX(-100%);
            transition: transform var(--transition-base);
            overflow-y: auto;
            padding: 1.5rem 1rem;
        }
        
        .sidebar.active { transform: translateX(0); }
        
        @media (min-width: 1024px) {
            .sidebar { transform: translateX(0); }
            .main-content { margin-left: 260px; }
        }
        
        .sidebar-section { margin-bottom: 1.5rem; }
        
        .sidebar-title {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 0.75rem;
            padding-left: 0.75rem;
        }
        
        .sidebar-link {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.875rem;
            border-radius: var(--radius-lg);
            transition: all var(--transition-fast);
            margin-bottom: 0.25rem;
            cursor: pointer;
            border: 1px solid transparent;
        }
        
        .sidebar-link:hover, .sidebar-link.active {
            background: rgba(59, 130, 246, 0.1);
            color: var(--text-primary);
            border-color: rgba(59, 130, 246, 0.3);
        }
        
        .sidebar-link i { width: 20px; text-align: center; color: var(--accent-primary); }
        .sidebar-link.active i { color: var(--accent-secondary); }

        /* Main Content */
        .main-content {
            flex: 1;
            padding-top: 64px;
            min-height: 100vh;
        }
        
        .section {
            display: none;
            padding: 2rem;
            animation: fadeIn 0.5s ease;
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .section.active { display: block; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            border-radius: var(--radius-full);
            font-family: 'Inter', sans-serif;
            font-size: 0.875rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: all var(--transition-base);
            position: relative;
            overflow: hidden;
        }
        
        .btn-primary {
            background: var(--gradient-blue);
            color: white;
            border: 1px solid rgba(59, 130, 246, 0.5);
            box-shadow: var(--shadow-glow);
        }
        
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 0 20px rgba(59, 130, 246, 0.4); }
        
        .btn-secondary {
            background: var(--glass-bg);
            color: var(--text-primary);
            border: var(--glass-border);
        }
        
        .btn-secondary:hover { background: rgba(59, 130, 246, 0.1); border-color: var(--accent-primary); }
        
        .btn-gold {
            background: var(--gradient-gold);
            color: #000;
            font-weight: 700;
        }
        
        .btn-gold:hover { transform: translateY(-2px); box-shadow: 0 0 20px rgba(245, 158, 11, 0.3); }
        
        .btn-outline {
            background: transparent;
            color: var(--text-primary);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .btn-outline:hover { border-color: var(--accent-primary); background: rgba(59, 130, 246, 0.1); }
        
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }
        .btn-sm { padding: 0.5rem 1rem; font-size: 0.8125rem; }
        .btn-lg { padding: 1rem 2rem; font-size: 0.9375rem; }

        /* Cards */
        .card {
            background: var(--gradient-card);
            border: var(--glass-border);
            border-radius: var(--radius-xl);
            padding: 1.5rem;
            transition: all var(--transition-base);
        }
        
        .card:hover { border-color: rgba(59, 130, 246, 0.3); }
        
        .card-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        
        .card-icon {
            width: 48px;
            height: 48px;
            background: var(--gradient-blue);
            border-radius: var(--radius-lg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            color: white;
        }
        
        .card-title { font-family: 'Space Grotesk', sans-serif; font-size: 1.125rem; font-weight: 600; }
        
        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
        }
        
        @media (min-width: 768px) {
            .stats-grid { grid-template-columns: repeat(4, 1fr); }
        }
        
        .stat-card {
            background: var(--gradient-card);
            border: var(--glass-border);
            border-radius: var(--radius-xl);
            padding: 1.25rem;
            text-align: center;
            transition: all var(--transition-base);
        }
        
        .stat-card:hover {
            transform: translateY(-4px);
            border-color: rgba(59, 130, 246, 0.3);
            box-shadow: var(--shadow-glow);
        }
        
        .stat-icon {
            width: 44px;
            height: 44px;
            background: rgba(59, 130, 246, 0.15);
            border-radius: var(--radius-lg);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 0.75rem;
            color: var(--accent-primary);
            font-size: 1.25rem;
        }
        
        .stat-value {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--venus-blue);
            margin-bottom: 0.25rem;
        }
        
        .stat-label { font-size: 0.8125rem; color: var(--text-muted); }

        /* Forms */
        .form-group { margin-bottom: 1.25rem; }
        
        .form-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
        }
        
        .form-input {
            width: 100%;
            padding: 0.875rem 1rem;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-lg);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 0.9375rem;
            transition: all var(--transition-fast);
        }
        
        .form-input:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        
        .form-input::placeholder { color: var(--text-muted); }

        /* Progress Ring */
        .progress-ring {
            position: relative;
            width: 120px;
            height: 120px;
        }
        
        .progress-ring svg { transform: rotate(-90deg); }
        
        .progress-ring-bg {
            fill: none;
            stroke: rgba(255, 255, 255, 0.1);
            stroke-width: 8;
        }
        
        .progress-ring-fill {
            fill: none;
            stroke: var(--accent-primary);
            stroke-width: 8;
            stroke-linecap: round;
            transition: stroke-dashoffset var(--transition-slow);
        }
        
        .progress-ring-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }
        
        .progress-ring-value { font-size: 1.5rem; font-weight: 700; color: var(--accent-primary); }
        .progress-ring-label { font-size: 0.75rem; color: var(--text-muted); }

        /* Rank Cards */
        .rank-grid {
            display: grid;
            grid-template-columns: repeat(1, 1fr);
            gap: 1rem;
            margin-top: 1.5rem;
        }
        
        @media (min-width: 640px) { .rank-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (min-width: 1024px) { .rank-grid { grid-template-columns: repeat(5, 1fr); } }
        
        .rank-card {
            background: var(--gradient-card);
            border: var(--glass-border);
            border-radius: var(--radius-xl);
            padding: 1.5rem;
            text-align: center;
            transition: all var(--transition-base);
            position: relative;
            overflow: hidden;
        }
        
        .rank-card.active {
            border-color: var(--gold);
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.2);
        }
        
        .rank-card.bronze { border-top: 3px solid var(--bronze); }
        .rank-card.silver { border-top: 3px solid var(--silver); }
        .rank-card.gold { border-top: 3px solid var(--gold-rank); }
        .rank-card.platinum { border-top: 3px solid var(--platinum); }
        .rank-card.diamond { border-top: 3px solid var(--diamond); }
        
        .rank-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 1rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
        }
        
        .rank-card.bronze .rank-icon { background: rgba(205, 127, 50, 0.2); color: var(--bronze); }
        .rank-card.silver .rank-icon { background: rgba(192, 192, 192, 0.2); color: var(--silver); }
        .rank-card.gold .rank-icon { background: rgba(255, 215, 0, 0.2); color: var(--gold-rank); }
        .rank-card.platinum .rank-icon { background: rgba(229, 228, 226, 0.2); color: var(--platinum); }
        .rank-card.diamond .rank-icon { background: rgba(185, 242, 255, 0.2); color: var(--diamond); }
        
        .rank-name { font-family: 'Space Grotesk', sans-serif; font-size: 1.25rem; font-weight: 700; margin-bottom: 0.5rem; }
        .rank-boost { font-size: 0.875rem; color: var(--venus-blue); margin-bottom: 1rem; }
        
        .rank-requirements {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-align: left;
            margin-top: 1rem;
        }
        
        .rank-requirements div { margin-bottom: 0.25rem; display: flex; justify-content: space-between; }
        
        /* Referral Pyramid */
        .pyramid-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            padding: 2rem;
        }
        
        .pyramid-level {
            display: flex;
            gap: 1rem;
            align-items: center;
        }
        
        .pyramid-node {
            width: 80px;
            padding: 0.75rem;
            background: var(--gradient-card);
            border: var(--glass-border);
            border-radius: var(--radius-lg);
            text-align: center;
            font-size: 0.875rem;
            font-weight: 600;
            transition: all var(--transition-base);
        }
        
        .pyramid-node.active {
            background: rgba(59, 130, 246, 0.2);
            border-color: var(--accent-primary);
            color: var(--accent-primary);
        }
        
        .pyramid-percent { font-size: 1.25rem; font-weight: 700; color: var(--gold); }
        .pyramid-level-label { font-size: 0.75rem; color: var(--text-muted); }

        /* Tables */
        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.875rem;
        }
        
        .data-table th, .data-table td {
            padding: 0.875rem 1rem;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .data-table th {
            background: rgba(59, 130, 246, 0.1);
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
        }
        
        .data-table tr:hover td { background: rgba(59, 130, 246, 0.05); }
        
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            padding: 0.375rem 0.75rem;
            border-radius: var(--radius-full);
            font-size: 0.75rem;
            font-weight: 600;
        }
        
        .badge-success { background: rgba(16, 185, 129, 0.15); color: var(--success); }
        .badge-warning { background: rgba(245, 158, 11, 0.15); color: var(--warning); }
        .badge-danger { background: rgba(239, 68, 68, 0.15); color: var(--danger); }
        .badge-info { background: rgba(59, 130, 246, 0.15); color: var(--info); }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all var(--transition-base);
            padding: 1rem;
        }
        
        .modal-overlay.active { opacity: 1; visibility: visible; }
        
        .modal {
            background: var(--gradient-card);
            border: var(--glass-border);
            border-radius: var(--radius-2xl);
            padding: 1.5rem;
            width: 100%;
            max-width: 480px;
            max-height: 85vh;
            overflow-y: auto;
            transform: scale(0.95);
            transition: transform var(--transition-base);
        }
        
        .modal-overlay.active .modal { transform: scale(1); }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }
        
        .modal-title { font-family: 'Space Grotesk', sans-serif; font-size: 1.25rem; font-weight: 600; }
        
        .modal-close {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: var(--radius-md);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition-fast);
        }
        
        .modal-close:hover { background: rgba(255, 255, 255, 0.2); color: var(--text-primary); }

        /* Notifications */
        .notification-container {
            position: fixed;
            top: 80px;
            right: 1rem;
            left: 1rem;
            z-index: 3000;
            display: flex;
            flex-direction: column;
            gap: 0.625rem;
        }
        
        @media (min-width: 640px) {
            .notification-container { left: auto; max-width: 380px; }
        }
        
        .notification {
            padding: 0.875rem 1.125rem;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: var(--glass-border);
            border-left: 3px solid var(--accent-primary);
            border-radius: var(--radius-lg);
            color: var(--text-primary);
            font-size: 0.875rem;
            box-shadow: var(--shadow-lg);
            animation: slideIn 0.4s ease;
            display: flex;
            align-items: center;
            gap: 0.625rem;
        }
        
        .notification.success { border-left-color: var(--success); }
        .notification.error { border-left-color: var(--danger); }
        .notification.warning { border-left-color: var(--warning); }
        
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* Hero Section */
        .hero {
            min-height: calc(100vh - 64px);
            display: flex;
            align-items: center;
            padding: 3rem 0;
        }
        
        .hero-content { text-align: center; max-width: 800px; margin: 0 auto; }
        
        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: rgba(0, 212, 170, 0.1);
            border: 1px solid rgba(0, 212, 170, 0.3);
            border-radius: var(--radius-full);
            font-size: 0.875rem;
            color: var(--venus-blue);
            margin-bottom: 1.5rem;
        }
        
        .hero-title {

                            });

        // ===== DATA LOADING =====
        async function loadUserData() {
            if (!AppState.userAccount || !AppState.contract) return;
            
            try {
                // Parallel data fetching
                const [
                    userStruct,
                    userSummary,
                    userNetwork,
                    userTime,
                    qualifiedStatus,
                    withdrawFee,
                    usdtBalance,
                    contractStats
                ] = await Promise.all([
                    AppState.contract.methods.users(AppState.userAccount).call(),
                    AppState.contract.methods.getUserSummary(AppState.userAccount).call(),
                    AppState.contract.methods.getUserNetwork(AppState.userAccount).call(),
                    AppState.contract.methods.getUserTime(AppState.userAccount).call(),
                    AppState.contract.methods.getQualifiedStatus(AppState.userAccount).call(),
                    AppState.contract.methods.getWithdrawFee(AppState.userAccount).call(),
                    AppState.usdtContract.methods.balanceOf(AppState.userAccount).call(),
                    AppState.contract.methods.getContractStats().call()
                ]);
                
                // Get rank info if user has rank
                let rankInfo = null;
                if (parseInt(userSummary.rank) > 0) {
                    rankInfo = await AppState.contract.methods.getRankInfo(parseInt(userSummary.rank)).call();
                }
                
                // Load downline
                const downlineLength = parseInt(await AppState.contract.methods.getDownlineLength(AppState.userAccount).call());
                const referrals = [];
                for (let i = 0; i < Math.min(downlineLength, 50); i++) {
                    try {
                        const [addr, deposit] = await AppState.contract.methods.getDownlineInfo(AppState.userAccount, i).call();
                        referrals.push({ address: addr, deposit: deposit });
                    } catch (e) { break; }
                }
                
                AppState.userData = {
                    ...userStruct,
                    summary: userSummary,
                    network: userNetwork,
                    time: userTime,
                    qualifiedStatus: qualifiedStatus,
                    withdrawFee: withdrawFee,
                    usdtBalance: usdtBalance,
                    rankInfo: rankInfo,
                    referrals: referrals
                };
                
                AppState.contractStats = contractStats;
                
                updateDashboardUI();
                updateStakingUI();
                updateReferralUI();
                updateLeadershipUI();
                
            } catch (error) {
                console.error('Error loading user data:', error);
                showNotification('Error loading user data', 'error');
            }
        }

            const ctx = document.getElementById('earningsChart');

            // Generate sample data based on user's actual data

            const baseROI = 0.003; // 0.3%

            const dailyRate = baseROI + boost;
            const deposit = parseFloat(AppState.userData.summary.activeDeposit) / 1e18;
            
            const roiData = labels.map((_, i) => deposit * dailyRate * (i + 1));
            const refData = labels.map((_, i) => (parseFloat(AppState.userData.summary.pendingBonuses) / 1e18) * (i / days));

        async function invest() {
            if (!AppState.isConnected) {
                showNotification('Please connect wallet first', 'warning');
                return;
            }
            
            const amount = document.getElementById('investAmount').value;
            const referrer = document.getElementById('referrerInput').value || localStorage.getItem('referrer') || '0x0000000000000000000000000000000000000000';
            
            if (!amount || parseFloat(amount) < 1) {
                showNotification('Minimum investment is 1 USDT', 'error');
                return;
            }
            
            try {
                const amountWei = AppState.web3.utils.toWei(amount, 'ether');
                
                // Check balance
                const balance = await AppState.usdtContract.methods.balanceOf(AppState.userAccount).call();
                if (BigInt(balance) < BigInt(amountWei)) {
                    showNotification('Insufficient USDT balance', 'error');
                    return;
                }
                
                // Approve
                showNotification('Approving USDT...', 'info');
                await AppState.usdtContract.methods.approve(CONTRACT_CONFIG.address, amountWei).send({ from: AppState.userAccount });
                
                // Invest
                showNotification('Processing investment...', 'info');
                await AppState.contract.methods.invest(amountWei, referrer).send({ from: AppState.userAccount });
                
                showNotification('Investment successful!', 'success');
                await loadUserData();
                
                // Clear inputs
                document.getElementById('investAmount').value = '';
                updateInvestmentPreview();
                
            } catch (error) {
                console.error('Investment error:', error);
                showNotification('Investment failed: ' + error.message, 'error');
            }
        }

        // ===== CALCULATORS =====
        function updateInvestmentPreview() {
            const amount = parseFloat(document.getElementById('investAmount').value) || 0;
            const minInvest = 1;
            
            if (amount < minInvest) {
                document.getElementById('investPreview').style.display = 'none';
                return;
            }
            
            const manageFee = amount * 0.1; // 10%
            const netDeposit = amount - manageFee;
            const baseDaily = netDeposit * 0.003;
            const rankBoost = AppState.userData?.rankInfo?.roiBoost || 0;
            const dailyROI = baseDaily * (1 + rankBoost / 100);
            const projection60 = dailyROI * 60;
            
            document.getElementById('previewNet').textContent = netDeposit.toFixed(2) + ' USDT';
            document.getElementById('previewFee').textContent = '-' + manageFee.toFixed(2) + ' USDT';
            document.getElementById('previewDaily').textContent = dailyROI.toFixed(4) + ' USDT';
            document.getElementById('preview60').textContent = projection60.toFixed(2) + ' USDT';
            document.getElementById('investPreview').style.display = 'block';
        }

        function calculateROI() {
            const amount = parseFloat(document.getElementById('calcAmount').value) || 0;
            const days = parseInt(document.getElementById('calcDays').value) || 60;
            const boost = parseInt(document.getElementById('calcBoost').value) || 0;
            
            const manageFee = amount * 0.1;
            const netDeposit = amount - manageFee;
            const baseDaily = netDeposit * 0.003;
            const dailyROI = baseDaily * (1 + boost / 100);
            const total = dailyROI * days;
            
            document.getElementById('calcResultDaily').textContent = dailyROI.toFixed(4) + ' USDT';
            document.getElementById('calcResultTotal').textContent = total.toFixed(2) + ' USDT';
            document.getElementById('calcResultNet').textContent = (total - manageFee).toFixed(2) + ' USDT';
        }

        // ===== UTILITIES =====
        function formatUSDT(weiValue) {
            if (!weiValue || weiValue === '0') return '0.00';
            try {
                const value = parseFloat(weiValue) / 1e18;
                return value.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            } catch (e) {
                return '0.00';
            }
        }

        function showNotification(message, type = 'info') {
            const container = document.getElementById('notificationContainer');
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            
            const icons = {
                success: 'check-circle',
                error: 'exclamation-circle',
                warning: 'exclamation-triangle',
                info: 'info-circle'
            };
            
            notification.innerHTML = `<i class="fas fa-${icons[type]}"></i><span>${message}</span>`;
            container.appendChild(notification);
            
            setTimeout(() => {
                notification.style.opacity = '0';
                setTimeout(() => notification.remove(), 300);
            }, 5000);
        }

        function setupEventListeners() {
            // Wallet events
            if (window.ethereum) {
                window.ethereum.on('accountsChanged', (accounts) => {
                    if (accounts.length === 0) {
                        disconnectWallet();
                    } else {
                        connectWallet(accounts[0]);
                    }
                });
                
                window.ethereum.on('chainChanged', () => window.location.reload());
            }
            
            // Investment input
            document.getElementById('investAmount')?.addEventListener('input', updateInvestmentPreview);
            
            // Calculator inputs
            ['calcAmount', 'calcDays', 'calcBoost'].forEach(id => {
                document.getElementById(id)?.addEventListener('input', calculateROI);
            });
            
            // FAQ toggles
            document.querySelectorAll('.faq-question').forEach(q => {
                q.addEventListener('click', () => {
                    const item = q.parentElement;
                    const answer = item.querySelector('.faq-answer');
                    item.classList.toggle('active');
                    answer.classList.toggle('active');
                });
            });
        }
